name: Build plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build InkShelf.snplg (JavaScript + native opener)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          bash buildPlugin.sh
          ls -la build/outputs build/generated
          unzip -l build/outputs/*.snplg
          unzip -p build/outputs/*.snplg PluginConfig.json

      - name: Check the native part is inside
        run: unzip -l build/outputs/*.snplg | grep -q "app.npk" || (echo "native part (app.npk) missing" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: InkShelf
          path: build/outputs/*.snplg

      - name: Save the build to the 'builds' branch
        if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/builds && cd /tmp/builds
          cp "$GITHUB_WORKSPACE"/build/outputs/*.snplg InkShelf.snplg
          printf "Latest InkShelf build from %s (%s)\n" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%MZ)" > BUILD.txt
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add InkShelf.snplg BUILD.txt
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds:builds

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/outputs/*.snplg --clobber

      # A version tag (v1.0.0…) publishes a GitHub Release with the plugin file, its notes and the walkthrough video
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES=".github/release-notes/${TAG}.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          cp build/outputs/*.snplg /tmp/InkShelf.snplg
          FILES="/tmp/InkShelf.snplg"
          [ -f docs/InkShelf-walkthrough.mp4 ] && FILES="$FILES docs/InkShelf-walkthrough.mp4"
          gh release create "$TAG" --title "InkShelf ${TAG#v}" --notes-file "$NOTES" $FILES
